<!DOCTYPE html>
<html>

<head>
    <title></title>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <style>
        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .container video {
            width: 100%;
            margin: 100rem auto;
            border-radius: 15rem;
        }

        .container .downBtnBox {
            padding: 25rem 75rem;
            border-radius: 15rem;
            background-color: rgb(0, 192, 0);
            vertical-align: bottom;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-size: 50rem;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <video controls preload loop autoplay muted playsinline>
            <source src="" />
        </video>
        <div class="downBtnBox">下载</div>
    </div>
    <script>
        function adjustFontSize() {
            const html = document.documentElement;
            html.style.fontSize = (html.clientWidth / 750) + 'px';
        }
        adjustFontSize()
        window.addEventListener('resize', adjustFontSize);
        function getLang() {
            const rawLang = (navigator.language || navigator.userLanguage).toLowerCase();
            // 中文变体
            if (rawLang.includes('zh')) {
                return rawLang.includes('tw') || rawLang.includes('hant') || rawLang.includes('hk')
                    ? 'TraditionalChinese' // 繁体中文
                    : 'SimplifiedChinese'; // 简体中文
            }
            // 其他语言
            const langMap = {
                en: 'English',
                es: 'Spanish',
                fr: 'French',
                ru: 'Russian',
                pt: 'Portuguese',
                de: 'German',
                ko: 'Korean',
                ja: 'Japanese',
                it: 'Italian'
            };
            return langMap[rawLang.split('-')[0]] || 'SimplifiedChinese'; // 默认中文
        }
        const langTxt = {
            'SimplifiedChinese': { download: '下载' },
            'TraditionalChinese': { download: '下載' },
            'English': { download: 'Download' },
            'Spanish': { download: 'Descargar' },
            'French': { download: 'Télécharger' },
            'Russian': { download: 'Скачать' },
            'Portuguese': { download: 'Baixar' },
            'German': { download: 'Herunterladen' },
            'Korean': { download: '다운로드' },
            'Japanese': { download: 'ダウンロード' },
            'Italian': { download: 'Scarica' },
        };
        const lang = getLang();
        const downBtnBox = document.querySelector('.downBtnBox');
        downBtnBox.textContent = langTxt[lang]?.download || langTxt['SimplifiedChinese']?.download;
        downBtnBox.onerror = () => {
            downBtnBox.textContent = langTxt['SimplifiedChinese'].download;
        };
        const params = new URLSearchParams(window.location.search);
        const videoURL = params.get('video') || '';
        const videoName = videoURL.split('/').pop() || '';
        const video = document.querySelector('video');
        const videoSource = document.querySelector('video source');
        videoSource.src = `videos/${videoURL}.mp4`;
        video.load();
        downBtnBox.addEventListener('click', download);
        function download() {
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = `videos/${videoURL}.mp4`;
            link.download = `${videoName}.mp4`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>

</html>
